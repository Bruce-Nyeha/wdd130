<!DOCTYPE html>
<html lang="en-US">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="description" content="Contact Exciting Expeditions Rafting for reservations, inquiries, or feedback. Find our phone, email, and office location.">
  <meta name="author" content="Bruce Nyeha">
  <link rel="stylesheet" href="styles/rafting.css">
  <title>Contact - Exciting Expeditions Rafting Company</title>
</head>

<body>
  <header>
    <figure>
      <img src="images/z-excitingexpedition.jpg" alt="Exciting Expeditions rafting company logo">
      <figcaption>Exciting Expeditions</figcaption>
    </figure>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="trips.html">Trips</a></li>
        <li><a href="contact.html">Contact Us</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Contact Us</h1>

    <h2>Send Us a Message</h2>
    <h3>White Water Rafting</h3>
    <p><strong>Address:</strong> Kolob Reservoir, Utah 84779, USA</p>
    <p><strong>Phone:</strong> +1 243 909 7766</p>
    <p><strong>Email:</strong> <a href="mailto:info@whitewater.com">info@whitewater.com</a></p>

    <div class="map">
      <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d18424.058238293142!2d-113.0661466287051!3d37.43986470154997!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x80ca96f62dde7a45%3A0xa62cd4a5e874f85e!2sKolob%20Reservoir!5e0!3m2!1sen!2sgh!4v1759427675841!5m2!1sen!2sgh"
        allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>

    <section class="employees">
      <h2>We Are Here to Serve You</h2>
      <figure>
        <img src="images/cto.jpg" alt="CTO of White Water Rafting">
        <figcaption><i>Mr. Dinesh – CTO</i></figcaption>
      </figure>
      <figure>
        <img src="images/ceo.jpg" alt="CEO of White Water Rafting">
        <figcaption><i>Mr. Richard – CEO</i></figcaption>
      </figure>
      <figure>
        <img src="images/director.jpg" alt="Director of White Water Rafting">
        <figcaption><i>Mr. Peter Gregory – Director</i></figcaption>
      </figure>
    </section>

    <form>
      <fieldset class="contact-info">
        <legend>Contact Information</legend>
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname" required><br>

        <label for="useremail">Email</label>
        <input type="email" id="useremail" name="useremail" required>
      </fieldset>

      <fieldset class="survey">
        <legend>Purpose</legend>
        <label for="general">
          <input type="radio" id="general" name="purpose" value="general"> General Inquiry
        </label><br>
        <label for="reservation">
          <input type="radio" id="reservation" name="purpose" value="reservation"> Reservation Question
        </label><br>
        <label for="suggestion">
          <input type="radio" id="suggestion" name="purpose" value="suggestion"> Website Suggestion
        </label>
      </fieldset>

      <fieldset class="comment">
        <legend>Message</legend>
        <label for="message">Your Message</label><br>
        <textarea id="message" name="message" rows="5" cols="40" required></textarea>
      </fieldset>

      <label for="newsletter">
        <input type="checkbox" id="newsletter" name="newsletter"> Please subscribe me to the monthly newsletter
      </label><br>

      <button type="submit">Get in Touch!</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2025 ✨Exciting Expeditions✨ Bruce Nyeha</p>
    <nav class="socialmedia">
      <a href="https://www.facebook.com/login/?locale=en_GB">
        <img src="images/facebook-logo.png" alt="Facebook icon">
      </a>
      <a href="https://www.linkedin.com/company/login">
        <img src="images/linkedin-logo.png" alt="LinkedIn icon">
      </a>
      <a href="https://www.instagram.com/accounts/login/?hl=en">
        <img src="images/instagram-logo.png" alt="Instagram icon">
      </a>
    </nav>
  </footer>
</body>
</html>
